basePath: /api/v1
info:
  contact: {}
  description: API documentation for Disaster Alert mobile app and admin dashboard
    integration.
  title: Disaster Alert
  version: "1.0"
paths:
  /admin/alerts:
    get:
      description: Admin dashboard fetches all alerts.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
      summary: Get all alerts
      tags:
      - Admin Alerts
    post:
      consumes:
      - application/json
      description: Admin dashboard creates a manual alert.
      parameters:
      - description: Create alert request
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
      summary: Create alert
      tags:
      - Admin Alerts
  /admin/alerts/{id}:
    delete:
      description: Admin dashboard deletes an alert.
      parameters:
      - description: Alert ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
      summary: Delete alert
      tags:
      - Admin Alerts
    get:
      description: Admin dashboard fetches one alert.
      parameters:
      - description: Alert ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
      summary: Get alert by ID
      tags:
      - Admin Alerts
  /admin/alerts/{id}/status:
    put:
      consumes:
      - application/json
      description: Admin dashboard updates an alert status.
      parameters:
      - description: Alert ID
        in: path
        name: id
        required: true
        type: string
      - description: Status update body
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
      summary: Update alert status
      tags:
      - Admin Alerts
  /admin/assistance:
    get:
      description: Admin dashboard fetches all user assistance requests.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
      summary: Get all assistance requests
      tags:
      - Admin Assistance
  /admin/assistance/{id}:
    get:
      description: Admin dashboard fetches one assistance request.
      parameters:
      - description: Assistance Request ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
      summary: Get assistance request by ID
      tags:
      - Admin Assistance
  /admin/assistance/{id}/status:
    put:
      consumes:
      - application/json
      description: Admin updates the status of a user assistance request.
      parameters:
      - description: Assistance Request ID
        in: path
        name: id
        required: true
        type: string
      - description: Status update body
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
      summary: Update assistance status
      tags:
      - Admin Assistance
  /admin/chats/conversations:
    get:
      description: Admin dashboard fetches all user chat conversations.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
      summary: Get chat conversations
      tags:
      - Admin Chats
  /admin/chats/conversations/{id}/messages:
    get:
      description: Admin dashboard fetches messages in a conversation.
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
      summary: Get conversation messages
      tags:
      - Admin Chats
    post:
      consumes:
      - application/json
      description: Admin dashboard sends a response message to a user conversation.
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      - description: Message body
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
      summary: Send chat message
      tags:
      - Admin Chats
  /admin/reports/{id}/approve:
    put:
      description: Admin approves a user report and converts it into an alert.
      parameters:
      - description: Report ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
      summary: Approve report
      tags:
      - Admin Reports
  /admin/sos:
    get:
      description: Admin dashboard fetches all SOS emergency requests.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
      summary: Get all SOS requests
      tags:
      - Admin SOS
  /admin/sos/{id}:
    get:
      description: Admin dashboard fetches one SOS emergency request.
      parameters:
      - description: SOS ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
      summary: Get SOS request by ID
      tags:
      - Admin SOS
  /admin/sos/{id}/status:
    put:
      consumes:
      - application/json
      description: Admin updates the status of an SOS request.
      parameters:
      - description: SOS ID
        in: path
        name: id
        required: true
        type: string
      - description: Status update body
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
      summary: Update SOS status
      tags:
      - Admin SOS
  /admin/ws:
    get:
      description: |
        Establishes a real-time WebSocket connection for the admin dashboard.

        Admin WebSocket URL:
        wss://disaster-alert-backend-tiql.onrender.com/api/v1/admin/ws

        Required header:
        Sigtrack-Admin-API-Key: YOUR_ADMIN_API_KEY

        Event format:
        {"type":"EVENT_NAME","data":{}}

        Admin dashboard events:
        SOS_CREATED - sent when a user creates an SOS request.
        ASSISTANCE_CREATED - sent when a user submits an assistance request.
        REPORT_CREATED - sent when a user submits a report.
        ALERT_CREATED - sent when an active alert is created.
        ALERT_APPROVED - sent when an alert/report is approved.
        CHAT_MESSAGE_CREATED - sent when a user sends a chat message.

        SOS_CREATED example:
        {"type":"SOS_CREATED","data":{"id":"sos_id","user":{"id":"user_id","name":"User","email":"user@email.com","phone":"0240000000","location":{"country":"Ghana","region":"Greater Accra","address":"Accra"}},"emergencyType":"medical","message":"Need help","latitude":5.6037,"longitude":-0.1870,"address":"Accra","status":"active","createdAt":"2026-06-11T10:00:00Z"}}

        ASSISTANCE_CREATED example:
        {"type":"ASSISTANCE_CREATED","data":{"id":"assistance_id","user":{"id":"user_id","name":"User","email":"user@email.com"},"assistanceType":"medical","urgencyLevel":"high","affectedIndividuals":3,"address":"Accra","status":"pending","createdAt":"2026-06-11T10:00:00Z"}}
      produces:
      - application/json
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
      security:
      - AdminApiKeyAuth: []
      summary: Connect Admin WebSocket
      tags:
      - Admin WebSocket
schemes:
- https
securityDefinitions:
  AdminApiKeyAuth:
    in: header
    name: Sigtrack-Admin-API-Key
    type: apiKey
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
