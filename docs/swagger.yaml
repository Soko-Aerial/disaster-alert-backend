        2. Backend checks that the report is not already approved or rejected.
        3. Backend creates a new public alert from the report.
        4. Backend copies report media into alert imageUrls or videoUrls.
        5. Backend updates the report status to approved.
        6. Backend sends notifications and WebSocket updates where configured.

        IMPORTANT:
        Use this endpoint only after an admin has verified that the report is credible.
        A normal mobile user should not be allowed to call this endpoint.

        REQUIRED HEADERS:
        - Sigtrack-Admin-API-Key: Your admin API key.
        - X-Privilege-Code: A valid privilege code with `reports:approve`.

        REQUIRED PERMISSION:
        reports:approve
      parameters:
      - description: Report ID to approve. This must be a pending report ID.
        example: 66e19b71c8f2a2b4d1234567
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Report approved and public alert created successfully. Response
            includes alertId and alert.
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Report cannot be approved. It may already be approved, rejected,
            or invalid.
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing or invalid Admin API Key.
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Missing, revoked, expired, or unauthorized privilege code.
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Report not found.
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to approve report because of server, repository, or
            database error.
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
      - PrivilegeCodeAuth: []
      summary: Approve a report and publish it as a public alert
      tags:
      - Admin Reports
