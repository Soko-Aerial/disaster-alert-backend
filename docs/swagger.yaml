  /reports:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Allows an authenticated mobile user to report an emergency, disaster, hazard, or incident.

        The report is saved as `pending` first.
        It does not become a public alert until an admin reviews and approves it.

        WHEN TO USE THIS ENDPOINT:
        Use this when a mobile user wants to report flooding, fire, road accident, health outbreak, weather danger, security incident, or another emergency.

        AUTH REQUIRED:
        This endpoint requires a valid user JWT token.
        Click Authorize and paste: Bearer YOUR_JWT_TOKEN

        REQUEST OPTIONS:
        This same endpoint supports two request types:

        1. JSON request for reports without file upload.
        Content-Type: application/json

        Example JSON body:
        {
        "category": "flood",
        "description": "Flooding has started around the roadside and vehicles cannot pass.",
        "timeOfOccurrence": "2026-09-10T08:30:00Z",
        "latitude": 5.6037,
        "longitude": -0.1870,
        "address": "Circle, Accra",
        "country": "Ghana",
        "region": "Greater Accra"
        }

        2. Multipart request for reports with image or video upload.
        Content-Type: multipart/form-data
        Use the form field named `media` for the uploaded file.

        REQUIRED FIELDS:
        - category: Type of incident. Example: flood
        - description: What happened. Example: Flooding has blocked the road.
        - timeOfOccurrence: When it happened. Example: 2026-09-10T08:30:00Z
        - latitude: Incident latitude. Example: 5.6037
        - longitude: Incident longitude. Example: -0.1870

        OPTIONAL FIELDS:
        - address: Human-readable location or landmark.
        - country: Country name.
        - region: Region/state name.
        - media: Optional image or video file.
      parameters:
      - description: 'Incident category. Allowed examples: flood, fire, security,
          health, weather, accident, other'
        enum:
        - flood
        - fire
        - security
        - health
        - weather
        - accident
        - other
        example: flood
        in: formData
        name: category
        required: true
        type: string
      - description: Describe what happened clearly.
        example: Flooding has started around the roadside and vehicles cannot pass.
        in: formData
        name: description
        required: true
        type: string
      - description: 'When the incident happened. Recommended format: ISO date/time.'
        example: "2026-09-10T08:30:00Z"
        in: formData
        name: timeOfOccurrence
        required: true
        type: string
      - description: Incident latitude.
        example: 5.6037
        in: formData
        name: latitude
        required: true
        type: number
      - description: Incident longitude.
        example: -0.187
        in: formData
        name: longitude
        required: true
        type: number
      - description: Readable location, area, landmark, or street.
        example: Circle, Accra
        in: formData
        name: address
        type: string
      - description: Country where the incident happened.
        example: Ghana
        in: formData
        name: country
        type: string
      - description: Region or state where the incident happened.
        example: Greater Accra
        in: formData
        name: region
        type: string
      - description: Optional image or video evidence.
        in: formData
        name: media
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Report submitted successfully. The report status will be pending.
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request body, validation failed, invalid location,
            or media upload failed.
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing or invalid user token.
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Server error while submitting report.
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Submit a new incident report
      tags:
      - User Reports
  /sos:
    post:
      consumes:
      - application/json
      description: |-
        Allows an authenticated mobile user to trigger an urgent SOS emergency request.

        WHEN TO USE THIS ENDPOINT:
        Use this when a user is in immediate danger and needs urgent help.
        Examples: medical emergency, fire, security threat, flood danger, road accident, or other emergency.

        DIFFERENCE BETWEEN SOS AND ASSISTANCE:
        - SOS is for immediate emergency panic situations.
        - Assistance is for structured help requests such as food, shelter, evacuation, or medical support.

        AUTH REQUIRED:
        This endpoint requires a valid user JWT token.
        Click Authorize and paste: Bearer YOUR_JWT_TOKEN.

        REQUIRED FIELDS:
        - emergencyType: Type of emergency. Example: medical.
        - latitude: User's current latitude.
        - longitude: User's current longitude.

        OPTIONAL FIELDS:
        - message: Extra message from the user.
        - address: Human-readable location or landmark.
        - accuracy: GPS accuracy in meters.
        - isLiveTracking: true if location tracking should continue while SOS is active.

        EXAMPLE REQUEST BODY:
        {
        "emergencyType": "medical",
        "message": "I need urgent help at my location.",
        "latitude": 5.6037,
        "longitude": -0.1870,
        "address": "Circle, Accra",
        "accuracy": 8.5,
        "isLiveTracking": true
        }
      parameters:
      - description: SOS request payload. emergencyType, latitude, and longitude are
          required.
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/disaster_alert_backend_internal_dto.CreateSOSRequest'
      produces:
      - application/json
      responses:
        "201":
          description: SOS request triggered successfully.
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request body, validation failed, or SOS could not be
            created.
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing, invalid, or expired user token.
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Server error while triggering SOS request.
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Trigger an emergency SOS
      tags:
      - User SOS
  /user/alert-preferences:
    get:
      description: |-
        Returns the authenticated user's alert category preferences.

        WHEN TO USE THIS ENDPOINT:
        Use this when the app opens the user's alert settings/preferences screen.
      produces:
      - application/json
      responses:
        "200":
          description: Alert preferences fetched successfully.
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing, invalid, or expired user token.
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to fetch alert preferences.
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get alert preferences
      tags:
      - User Settings
    put:
      consumes:
      - application/json
      description: |-
        Updates the authenticated user's alert category preferences.

        WHEN TO USE THIS ENDPOINT:
        Use this when the user enables or disables alert categories in the app settings.

        IMPORTANT:
        All fields are optional. Send only the categories you want to change.
        Use true to enable a category and false to disable it.

        EXAMPLE REQUEST BODY:
        {
        "fire": true,
        "flood": true,
        "weather": true,
        "health": true,
        "criticalAlerts": true
        }
      parameters:
      - description: Alert preference update payload. All fields are optional.
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/disaster_alert_backend_internal_dto.UpdateAlertPreferenceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Alert preferences updated successfully.
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request body.
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing, invalid, or expired user token.
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to update alert preferences.
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update alert preferences
      tags:
      - User Settings
  /ws:
    get:
      description: |-
        Establishes a real-time WebSocket connection for mobile users or admin dashboards.

        USER WEBSOCKET URL:
        ws://localhost:8080/api/v1/ws
        wss://disaster-alert-backend-tiql.onrender.com/api/v1/ws

        USER AUTH:
        Mobile/user WebSocket connections require a valid JWT token.
        Recommended connection style:
        Authorization: Bearer YOUR_JWT_TOKEN

        ADMIN WEBSOCKET URL:
        ws://localhost:8080/api/v1/admin/ws
        wss://disaster-alert-backend-tiql.onrender.com/api/v1/admin/ws

        ADMIN AUTH:
        Admin WebSocket connections require the admin API key.
        Required header:
        Sigtrack-Admin-API-Key: YOUR_ADMIN_API_KEY

        EVENT FORMAT:
        All WebSocket events follow this structure:
        {
        "type": "EVENT_NAME",
        "data": {}
        }

        EVENTS SENT TO ADMINS:
        - SOS_CREATED: A user triggered SOS.
        - ASSISTANCE_CREATED: A user submitted an assistance request.
        - REPORT_CREATED: A user submitted an incident report.
        - CHAT_MESSAGE_CREATED: A user sent a chat message.

        EVENTS SENT TO USERS BY COUNTRY:
        - ALERT_CREATED: A new active alert was created for the user's country.
        - ALERT_APPROVED: A report was approved and converted into an alert for the user's country.

        EVENTS SENT TO SPECIFIC USERS:
        - NOTIFICATION_CREATED: A new in-app notification was created.
        - CHAT_MESSAGE_CREATED: A new chat message was sent to the user.
        - SOS_STATUS_UPDATED: The user's SOS status changed.
        - ASSISTANCE_STATUS_UPDATED: The user's assistance request status changed.

        EXAMPLE EVENT:
        {
        "type": "ALERT_CREATED",
        "data": {
        "id": "66e19b71c8f2a2b4d1234567",
        "title": "Heavy rainfall warning",
        "category": "weather",
        "severity": "high",
        "country": "Ghana",
        "createdAt": "2026-09-10T10:00:00Z"
        }
        }

        IMPORTANT:
        Swagger UI does not fully test WebSocket connections like normal REST endpoints.
        Use Postman, Hoppscotch, browser client code, or your Flutter app to test WebSocket connections.
      produces:
      - application/json
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
        "401":
          description: Missing, invalid, or expired WebSocket authentication.
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Connect to real-time WebSocket
      tags:
      - WebSocket
schemes:
- http
- https
securityDefinitions:
  AdminApiKeyAuth:
    in: header
    name: Sigtrack-Admin-API-Key
    type: apiKey
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
  PrivilegeCodeAuth:
    in: header
    name: X-Privilege-Code
    type: apiKey
swagger: "2.0"
