  /admin/privilege-codes:
    get:
      description: |-
        Returns privilege-code records created for organisations, departments, units, or admin levels.

        IMPORTANT:
        This endpoint does not return the full UUID.
        It returns codePrefix only so admins can identify records without exposing the secret privilege code.

        REQUIRED HEADER:
        - Sigtrack-Admin-API-Key: Your admin API key.
      parameters:
      - description: Maximum number of privilege-code records to return. Default is
          50. Maximum is 200.
        example: 50
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Privilege codes fetched successfully.
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Admin API key missing or invalid.
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to fetch privilege codes.
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
      summary: List admin privilege codes
      tags:
      - Admin Privilege Codes
    post:
      consumes:
      - application/json
      description: |-
        Creates a new privilege code for an organisation, unit, department, or admin level.

        WHEN TO USE THIS ENDPOINT:
        Use this when you want to give a department, organisation, responder group, or admin user controlled access to admin endpoints.

        HOW PRIVILEGE CODES WORK:
        1. This endpoint creates a full UUID privilege code.
        2. The full UUID is returned only once.
        3. The backend stores a secure hash, not the raw UUID.
        4. The admin copies the UUID and sends it as X-Privilege-Code when calling protected admin endpoints.

        REQUIRED HEADER:
        - Sigtrack-Admin-API-Key: Your admin API key.

        IMPORTANT:
        The full UUID is returned only once during creation.
        codePrefix is only for display and audit logs.
        Do not use codePrefix as X-Privilege-Code.
        If the full UUID is lost, revoke the old code and generate a new one.

        EXAMPLE REQUEST BODY:
        {
        "label": "Police Traffic Unit Access",
        "purpose": "Allow Police Traffic Unit to view reports and update SOS status",
        "organisationId": "firebase_police_org_id",
        "organisationName": "Ghana Police Service",
        "levelId": "firebase_traffic_unit_id",
        "levelName": "Traffic Unit",
        "permissions": ["reports:read", "sos:read", "sos:update_status"],
        "expiresAt": "2026-09-30T23:59:00Z"
        }

        COMMON PERMISSIONS:
        - reports:read
        - reports:approve
        - alerts:read
        - alerts:create
        - alerts:update
        - alerts:delete
        - sos:read
        - sos:update_status
        - assistance:read
        - assistance:update_status
        - chats:read
        - chats:send
        - notifications:send
      parameters:
      - description: Privilege code creation payload. label, organisationId, organisationName,
          and permissions are required.
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/disaster_alert_backend_internal_dto.CreateAdminPrivilegeCodeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Privilege code created successfully. Copy data.uuid or data.code
            depending on your service response and use it as X-Privilege-Code.
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request body, validation error, invalid permission,
            or invalid expiry date.
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Admin API key missing or invalid.
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Server error while creating privilege code.
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
      summary: Generate a new admin privilege UUID
      tags:
      - Admin Privilege Codes
  /admin/privilege-codes/{id}:
    get:
      description: |-
        Fetches one privilege-code record by database ID.

        IMPORTANT:
        This endpoint does not return the full UUID.
        If the full UUID is lost, revoke the old privilege code and generate a new one.
      parameters:
      - description: Privilege-code database ID. This is the MongoDB ObjectID of the
          privilege-code record.
        example: 66e19b71c8f2a2b4d1234567
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Privilege code fetched successfully.
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid privilege-code ID.
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Admin API key missing or invalid.
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Privilege code not found.
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to fetch privilege code.
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
      summary: Get one privilege-code record
      tags:
      - Admin Privilege Codes
  /admin/privilege-codes/{id}/revoke:
    put:
      consumes:
      - application/json
      description: |-
        Disables a privilege UUID so it can no longer be used on protected admin endpoints.

        WHAT REVOKE MEANS:
        Revoke does not delete the database record.
        It changes the privilege-code status from active to revoked.
        The old UUID stops working, but the record remains for audit history.

        WHEN TO REVOKE:
        Revoke a code when it is leaked, no longer trusted, assigned to the wrong level, or needs to be replaced by a new UUID.

        EXAMPLE REQUEST BODY:
        {
        "reason": "Access no longer needed"
        }
      parameters:
      - description: Privilege-code database ID. This is the MongoDB ObjectID of the
          privilege-code record.
        example: 66e19b71c8f2a2b4d1234567
        in: path
        name: id
        required: true
        type: string
      - description: Optional revocation reason.
        in: body
        name: request
        schema:
          $ref: '#/definitions/disaster_alert_backend_internal_dto.RevokeAdminPrivilegeCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Privilege code revoked successfully.
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request or privilege code already revoked.
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Admin API key missing or invalid.
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Privilege code not found.
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Server error while revoking privilege code.
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
      summary: Revoke a privilege code
      tags:
      - Admin Privilege Codes
  /admin/privilege-codes/validate:
    post:
      consumes:
      - application/json
      description: |-
        Checks whether a full UUID privilege code is valid, active, not expired, and usable.

        WHEN TO USE THIS ENDPOINT:
        Use this after generating a privilege code to confirm that the full UUID works before using protected admin endpoints.

        IMPORTANT:
        Send the full UUID in the request body.
        Do not send codePrefix.
        codePrefix is only for display and audit logs.

        EXAMPLE REQUEST BODY:
        {
        "uuid": "4e1b5a0a-71d7-40ad-9f30-9f1c4cbb1d9e"
        }
      parameters:
      - description: Full privilege UUID validation payload. uuid is required.
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/disaster_alert_backend_internal_dto.ValidateAdminPrivilegeCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Privilege code is valid.
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request body, invalid UUID, expired code, revoked code,
            or inactive code.
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Admin API key missing or invalid.
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Server error while validating privilege code.
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
      summary: Validate a privilege UUID
      tags:
      - Admin Privilege Codes
