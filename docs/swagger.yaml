basePath: /api/v1
definitions:
  disaster_alert_backend_internal_dto.CreateAdminPrivilegeCodeRequest:
    properties:
      expiresAt:
        description: |-
          ExpiresAt is the optional expiry date/time for the privilege code.

          Recommended format:
          2026-09-30T23:59:00Z
        example: "2026-09-30T23:59:00Z"
        type: string
      label:
        description: Label is the readable name of this privilege code.
        example: Police Traffic Unit Access
        type: string
      levelId:
        description: LevelID is the optional department, unit, role, or level identifier.
        example: firebase_traffic_unit_id
        type: string
      levelName:
        description: LevelName is the readable department, unit, role, or level name.
        example: Traffic Unit
        type: string
      organisationId:
        description: OrganisationID is the external/internal organisation identifier.
        example: firebase_police_org_id
        type: string
      organisationName:
        description: OrganisationName is the readable organisation name.
        example: Ghana Police Service
        type: string
      permissions:
        description: |-
          Permissions is the list of allowed admin actions for this privilege code.

          Examples:
          reports:read, reports:approve, alerts:read, alerts:create,
          alerts:update, alerts:delete, sos:read, sos:update_status,
          assistance:read, assistance:update_status, chats:read, chats:send,
          notifications:send
        example:
        - reports:read
        - reports:approve
        - alerts:read
        items:
          type: string
        minItems: 1
        type: array
      purpose:
        description: Purpose explains why this privilege code exists.
        example: Allow Police Traffic Unit to view SOS and update SOS status
        type: string
    required:
    - label
    - organisationId
    - organisationName
    - permissions
    type: object
  disaster_alert_backend_internal_dto.CreateAlertRequest:
    properties:
      address:
        description: Address is a readable location, landmark, town, street, or area
          name.
        example: Circle, Accra
        type: string
      category:
        description: |-
          Category describes the type of alert.

          Allowed values:
          flood, fire, weather, health, security, earthquake, conflict, other
        enum:
        - flood
        - fire
        - weather
        - health
        - security
        - earthquake
        - conflict
        - other
        example: flood
        type: string
      confidence:
        description: |-
          Confidence is how reliable the alert is.

          Example:
          0.95 means 95% confidence.
        example: 0.95
        type: number
      country:
        description: Country is the affected country.
        example: Ghana
        type: string
      description:
        description: |-
          Description gives the full details of the alert.
          Minimum length: 5 characters.
        example: Heavy rainfall is expected in Accra with possible flooding in low-lying
          areas.
        minLength: 5
        type: string
      eventTime:
        description: |-
          EventTime is when the emergency happened or is expected to happen.

          Recommended format:
          2026-09-10T08:30:00Z
        example: "2026-09-10T08:30:00Z"
        type: string
      expiresAt:
        description: |-
          ExpiresAt is when the alert should stop being treated as active.

          Recommended format:
          2026-09-11T18:00:00Z
        example: "2026-09-11T18:00:00Z"
        type: string
      externalId:
        description: ExternalID is used when the alert comes from an external source
          such as GDACS, ReliefWeb, NASA FIRMS, or GDELT.
        example: GDACS-12345
        type: string
      imageUrls:
        description: ImageURLs contains image evidence or images related to the alert.
        example:
        - https://example.com/flood-image.jpg
        items:
          type: string
        type: array
      latitude:
        description: Latitude is the GPS latitude of the alert location.
        example: 5.6037
        type: number
      longitude:
        description: Longitude is the GPS longitude of the alert location.
        example: -0.187
        type: number
      priorityLabel:
        description: |-
          PriorityLabel is a readable priority level.

          Allowed values:
          breaking, serious, watch, low
        enum:
        - breaking
        - serious
        - watch
        - low
        example: serious
        type: string
      priorityScore:
        description: |-
          PriorityScore is a numeric urgency score.

          Example:
          85 means serious or breaking depending on your service logic.
        example: 85
        type: integer
      radiusKm:
        description: |-
          RadiusKm is the approximate affected area around the latitude/longitude.

          Example: 10 means users within about 10km may be affected.
        example: 10
        type: number
      region:
        description: Region is the affected region, state, province, or administrative
          area.
        example: Greater Accra
        type: string
      safetyInstructions:
        description: SafetyInstructions are clear actions users should take.
        example:
        - Move to higher ground
        - Follow official instructions
        - Avoid flooded roads
        items:
          type: string
        type: array
      severity:
        description: |-
          Severity describes how serious the alert is.

          Allowed values:
          low, medium, high, critical
        enum:
        - low
        - medium
        - high
        - critical
        example: high
        type: string
      sourceName:
        description: SourceName is the human-readable source of the alert.
        example: Admin Dashboard
        type: string
      sourceType:
        description: |-
          SourceType identifies where the alert came from.

          Allowed values:
          internal, external, system, user_report, weather, health, news, admin
        enum:
        - internal
        - external
        - system
        - user_report
        - weather
        - health
        - news
        - admin
        example: admin
        type: string
      sourceUrl:
        description: SourceURL is an optional link to the original source.
        example: https://example.com/source-alert
        type: string
      status:
        description: |-
          Status controls whether the alert is visible/active.

          If omitted, your service may default it to active or draft depending on your service logic.
        enum:
        - draft
        - active
        - resolved
        - expired
        - cancelled
        example: active
        type: string
      summary:
        description: |-
          Summary is a shorter version of the description.
          It is useful for cards, notifications, and alert previews.
        example: Heavy rainfall expected in Accra with possible flooding.
        type: string
      tags:
        description: Tags help classify and search alerts.
        example:
        - flood
        - ghana
        - accra
        items:
          type: string
        type: array
      title:
        description: Title is the short headline users will see first.
        example: Heavy rainfall warning
        type: string
      videoUrls:
        description: VideoURLs contains video evidence or videos related to the alert.
        example:
        - https://example.com/flood-video.mp4
        items:
          type: string
        type: array
    required:
    - category
    - description
    - latitude
    - longitude
    - severity
    - title
    type: object
  disaster_alert_backend_internal_dto.CreateAssistanceRequest:
    properties:
      address:
        description: Address is the readable location, landmark, street, or area name.
        example: Circle, Accra
        type: string
      affectedIndividuals:
        description: |-
          AffectedIndividuals is the number of people who need help.

          Minimum value: 1
        example: 3
        minimum: 1
        type: integer
      assistanceType:
        description: |-
          AssistanceType describes the kind of help the user needs.

          Allowed values:
          medical, rescue, food, shelter, security, evacuation, other
        enum:
        - medical
        - rescue
        - food
        - shelter
        - security
        - evacuation
        - other
        example: medical
        type: string
      latitude:
        description: Latitude is the user's current GPS latitude.
        example: 5.6037
        type: number
      longitude:
        description: Longitude is the user's current GPS longitude.
        example: -0.187
        type: number
      otherInformation:
        description: |-
          OtherInformation gives extra details about the situation.

          Example: injuries, blocked access, trapped people, security concern,
          food shortage, shelter need, or evacuation challenge.
        example: One person is injured and needs urgent medical support.
        type: string
      urgencyLevel:
        description: |-
          UrgencyLevel describes how urgent the assistance request is.

          Allowed values:
          low, medium, high, critical
        enum:
        - low
        - medium
        - high
        - critical
        example: high
        type: string
    required:
    - affectedIndividuals
    - assistanceType
    - latitude
    - longitude
    - urgencyLevel
    type: object
  disaster_alert_backend_internal_dto.CreateConversationRequest:
    properties:
      caseId:
        description: CaseID is the MongoDB ObjectID of the related SOS, assistance
          request, or report.
        example: 667c9b2f12ab34cd56ef7890
        type: string
      caseType:
        description: |-
          CaseType describes what this conversation is connected to.

          Allowed values:
          sos, assistance, report, general
        enum:
        - sos
        - assistance
        - report
        - general
        example: assistance
        type: string
      contactId:
        description: ContactID is the MongoDB ObjectID of the emergency contact or
          participant, if applicable.
        example: 667c9b2f12ab34cd56ef7891
        type: string
      title:
        description: Title is the conversation title shown in the chat list.
        example: Flood assistance conversation
        type: string
    required:
    - title
    type: object
  disaster_alert_backend_internal_dto.CreateEmergencyContactRequest:
    properties:
      address:
        description: Address is the contact's address or office location.
        example: Accra, Ghana
        type: string
      email:
        description: Email is the contact email address.
        example: ama@example.com
        type: string
      isGovernment:
        description: IsGovernment marks this contact as a government or official response
          contact.
        example: false
        type: boolean
      isPrimary:
        description: IsPrimary marks this as the user's main emergency contact.
        example: true
        type: boolean
      name:
        description: Name is the contact person's or organization's name.
        example: Ama Mensah
        type: string
      organization:
        description: Organization is the organization name if this contact belongs
          to an institution.
        example: National Ambulance Service
        type: string
      phone:
        description: Phone is the contact phone number.
        example: "+233241234567"
        type: string
      relationship:
        description: Relationship describes how this contact is related to the user.
        example: Mother
        type: string
      type:
        description: |-
          Type describes the contact category.

          Examples:
          personal, family, medical, police, fire, ambulance, government, organization, other
        enum:
        - personal
        - family
        - medical
        - police
        - fire
        - ambulance
        - government
        - organization
        - other
        example: family
        type: string
    required:
    - name
    - phone
    type: object
  disaster_alert_backend_internal_dto.CreateEmergencyMessageRequest:
    properties:
      location:
        allOf:
        - $ref: '#/definitions/disaster_alert_backend_internal_dto.EmergencyMessageLocationRequest'
        description: Location is optional location information attached to the message.
      message:
        description: Message is the full emergency message text.
        example: I need urgent help at my current location.
        type: string
      title:
        description: Title is the short title of the emergency message.
        example: Need urgent help
        type: string
      type:
        description: |-
          Type describes the message category.

          Examples:
          free_text, sos, assistance, report, template
        enum:
        - free_text
        - sos
        - assistance
        - report
        - template
        example: free_text
        type: string
    required:
    - message
    type: object
  disaster_alert_backend_internal_dto.CreateSOSRequest:
    properties:
      accuracy:
        description: Accuracy is the GPS accuracy in meters, if available from the
          mobile device.
        example: 8.5
        type: number
      address:
        description: Address is the readable location, landmark, street, or area name.
        example: Circle, Accra
        type: string
      emergencyType:
        description: |-
          EmergencyType describes the kind of emergency.

          Allowed values:
          medical, fire, security, flood, accident, other
        enum:
        - medical
        - fire
        - security
        - flood
        - accident
        - other
        example: medical
        type: string
      isLiveTracking:
        description: |-
          IsLiveTracking tells the backend whether the user wants location updates
          to continue while the emergency is active.
        example: true
        type: boolean
      latitude:
        description: Latitude is the user's current GPS latitude.
        example: 5.6037
        type: number
      longitude:
        description: Longitude is the user's current GPS longitude.
        example: -0.187
        type: number
      message:
        description: Message is an optional emergency message from the user.
        example: I need urgent help at my location.
        type: string
    required:
    - emergencyType
    - latitude
    - longitude
    type: object
  disaster_alert_backend_internal_dto.EmergencyMessageLocationRequest:
    properties:
      address:
        description: Address is the readable location or landmark.
        example: Circle, Accra
        type: string
      latitude:
        description: Latitude is the user's GPS latitude.
        example: 5.6037
        type: number
      longitude:
        description: Longitude is the user's GPS longitude.
        example: -0.187
        type: number
    type: object
  disaster_alert_backend_internal_dto.LoginRequest:
    properties:
      email:
        description: Email is the user's registered email address.
        example: kwame@example.com
        type: string
      password:
        description: Password is the user's account password.
        example: StrongPass123
        type: string
    required:
    - email
    - password
    type: object
  disaster_alert_backend_internal_dto.MarkAppNotificationReadRequest:
    properties:
      notificationIds:
        items:
          type: string
        type: array
    type: object
  disaster_alert_backend_internal_dto.MarkConversationReadRequest:
    properties:
      messageIds:
        description: MessageIDs is the list of chat message IDs to mark as read.
        example:
        - 667c9b2f12ab34cd56ef7892
        items:
          type: string
        type: array
    type: object
  disaster_alert_backend_internal_dto.RegisterRequest:
    properties:
      email:
        description: |-
          Email is the user's login email address.
          It must be a valid email format.
        example: kwame@example.com
        type: string
      name:
        description: |-
          Name is the user's full name.
          Minimum length: 2 characters.
        example: Kwame Mensah
        minLength: 2
        type: string
      password:
        description: |-
          Password is the user's account password.
          Minimum length: 6 characters.
        example: StrongPass123
        minLength: 6
        type: string
      phone:
        description: |-
          Phone is the user's phone number.
          This is optional.
        example: "+233241234567"
        type: string
    required:
    - email
    - name
    - password
    type: object
  disaster_alert_backend_internal_dto.RevokeAdminPrivilegeCodeRequest:
    properties:
      reason:
        description: Reason explains why the privilege code is being revoked.
        example: Access no longer needed
        type: string
    type: object
  disaster_alert_backend_internal_dto.SaveFCMTokenRequest:
    properties:
      deviceType:
        type: string
      token:
        type: string
    required:
    - token
    type: object
  disaster_alert_backend_internal_dto.SendChatMessageRequest:
    properties:
      message:
        example: Help is on the way. Please remain in a safe location.
        type: string
    required:
    - message
    type: object
  disaster_alert_backend_internal_dto.SendEmergencyMessageRequest:
    properties:
      contactIds:
        description: |-
          ContactIDs is the list of emergency contact IDs to send the message to.

          Leave empty if sendToAllContacts is true.
        example:
        - 66e19b71c8f2a2b4d1234567
        items:
          type: string
        type: array
      location:
        allOf:
        - $ref: '#/definitions/disaster_alert_backend_internal_dto.EmergencyMessageLocationRequest'
        description: Location is optional location information attached to the message.
      message:
        description: Message is the full emergency message text.
        example: I need urgent help at my current location.
        type: string
      sendToAllContacts:
        description: SendToAllContacts sends the message to all active emergency contacts
          when true.
        example: true
        type: boolean
      title:
        description: Title is the short title of the emergency message.
        example: Emergency help needed
        type: string
    required:
    - message
    type: object
  disaster_alert_backend_internal_dto.SendTestNotificationRequest:
    properties:
      body:
        type: string
      title:
        type: string
    required:
    - body
    - title
    type: object
  disaster_alert_backend_internal_dto.UpdateAlertPreferenceRequest:
    properties:
      conflict:
        description: Conflict alerts.
        example: true
        type: boolean
      criticalAlerts:
        description: CriticalAlerts controls whether the user receives critical/highest
          priority alerts.
        example: true
        type: boolean
      drought:
        description: Drought alerts.
        example: false
        type: boolean
      earthquake:
        description: Earthquake alerts.
        example: false
        type: boolean
      fire:
        description: Fire alerts.
        example: true
        type: boolean
      flood:
        description: Flood alerts.
        example: true
        type: boolean
      galamsey:
        description: Galamsey or illegal mining-related alerts.
        example: false
        type: boolean
      health:
        description: Health alerts such as outbreaks, contamination, or public health
          warnings.
        example: true
        type: boolean
      munitions:
        description: Munitions or explosive-related alerts.
        example: true
        type: boolean
      protests:
        description: Protest or civil unrest alerts.
        example: true
        type: boolean
      robbery:
        description: Robbery or crime-related alerts.
        example: true
        type: boolean
      unverifiedActivity:
        description: Unverified activity alerts.
        example: false
        type: boolean
      weather:
        description: Weather alerts such as storms, heavy rainfall, heat, wind, or
          severe weather.
        example: true
        type: boolean
    type: object
  disaster_alert_backend_internal_dto.UpdateAlertStatusRequest:
    properties:
      status:
        description: |-
          Status is the new alert status.

          Allowed values:
          draft, active, resolved, expired, cancelled
        enum:
        - draft
        - active
        - resolved
        - expired
        - cancelled
        example: resolved
        type: string
    required:
    - status
    type: object
  disaster_alert_backend_internal_dto.UpdateAssistanceStatusRequest:
    properties:
      status:
        description: |-
          Status is the new assistance request status.

          Allowed values:
          pending, accepted, en_route, arrived, completed, cancelled, rejected
        enum:
        - pending
        - accepted
        - en_route
        - arrived
        - completed
        - cancelled
        - rejected
        example: en_route
        type: string
    required:
    - status
    type: object
  disaster_alert_backend_internal_dto.UpdateEmergencyContactRequest:
    properties:
      address:
        description: Address is the contact's address or office location.
        example: Accra, Ghana
        type: string
      email:
        description: Email is the contact email address.
        example: ama@example.com
        type: string
      isActive:
        description: IsActive controls whether this contact is currently active.
        example: true
        type: boolean
      isGovernment:
        description: IsGovernment marks this contact as a government or official response
          contact.
        example: false
        type: boolean
      isPrimary:
        description: IsPrimary marks this as the user's main emergency contact.
        example: true
        type: boolean
      name:
        description: Name is the contact person's or organization's name.
        example: Ama Mensah
        type: string
      organization:
        description: Organization is the organization name if this contact belongs
          to an institution.
        example: National Ambulance Service
        type: string
      phone:
        description: Phone is the contact phone number.
        example: "+233241234567"
        type: string
      relationship:
        description: Relationship describes how this contact is related to the user.
        example: Mother
        type: string
      type:
        description: Type describes the contact category.
        enum:
        - personal
        - family
        - medical
        - police
        - fire
        - ambulance
        - government
        - organization
        - other
        example: family
        type: string
    type: object
  disaster_alert_backend_internal_dto.UpdateSOSStatusRequest:
    properties:
      status:
        description: |-
          Status is the new SOS status.

          Allowed values:
          active, assigned, resolved, cancelled
        enum:
        - active
        - assigned
        - resolved
        - cancelled
        example: resolved
        type: string
    required:
    - status
    type: object
  disaster_alert_backend_internal_dto.ValidateAdminPrivilegeCodeRequest:
    properties:
      uuid:
        description: |-
          UUID is the full privilege code returned during creation.

          Do not use codePrefix here.
        example: 4e1b5a0a-71d7-40ad-9f30-9f1c4cbb1d9e
        type: string
    required:
    - uuid
    type: object
info:
  contact: {}
  description: |-
    Disaster Alert API is a mission-control backend for disaster intelligence, community incident reports, SOS escalation, assistance coordination, emergency messaging, public alerts, chats, notifications, and administrator response operations.

    ================================
    QUICK START
    ================================

    Use this Swagger page to test the API safely.

    For mobile/user endpoints:
    1. Register or login using /auth/register or /auth/login.
    2. Copy the token from the login response.
    3. Click Authorize.
    4. Paste it like this: Bearer YOUR_JWT_TOKEN.
    5. Test endpoints such as /reports, /alerts, /sos, /assistance, /notifications, and /chats.

    For admin endpoints:
    1. Enter the Admin API Key under AdminApiKeyAuth.
    2. Create or validate a privilege code.
    3. Enter the full privilege code under PrivilegeCodeAuth.
    4. Test admin endpoints such as /admin/reports, /admin/alerts, /admin/sos, /admin/assistance, and /admin/chats.

    ================================
    AUTHENTICATION GUIDE
    ================================

    1. Mobile/User endpoints use BearerAuth.
    Required header:
    Authorization: Bearer <JWT_TOKEN>

    2. Basic admin management endpoints use AdminApiKeyAuth.
    Required header:
    Sigtrack-Admin-API-Key: <ADMIN_API_KEY>

    3. Privileged admin operation endpoints require BOTH AdminApiKeyAuth and PrivilegeCodeAuth.
    Required headers:
    Sigtrack-Admin-API-Key: <ADMIN_API_KEY>
    X-Privilege-Code: <GENERATED_UUID>

    ================================
    ADMIN PRIVILEGE CODE FLOW
    ================================

    Step 1: Click Authorize in Swagger.
    Step 2: Enter your Admin API Key under AdminApiKeyAuth.
    Step 3: Call POST /admin/privilege-codes to generate a privilege UUID.
    Step 4: Copy the full UUID from data.code in the response.
    Step 5: Click Authorize again and paste the UUID under PrivilegeCodeAuth.
    Step 6: Test protected admin endpoints.

    Important:
    The full UUID is returned only once during creation.
    codePrefix is only for display and audit logs. Do not use codePrefix as X-Privilege-Code.

    ================================
    COMMON REQUEST NOTES
    ================================

    POST and PUT endpoints usually require a request body.
    Open the endpoint in Swagger and check the Parameters section.
    For JSON endpoints, send Content-Type: application/json.
    For upload endpoints, send Content-Type: multipart/form-data.

    Required fields are marked as required in the request schema or form fields.
    Optional fields can be omitted unless your frontend needs them.
    Date/time fields should use ISO format where possible, for example: 2026-09-10T08:30:00Z.

    ================================
    ADMIN PERMISSION CATALOG
    ================================

    Reports:
    - reports:read
    - reports:approve

    Assistance:
    - assistance:read
    - assistance:update_status

    SOS:
    - sos:read
    - sos:update_status

    Alerts:
    - alerts:read
    - alerts:create
    - alerts:update
    - alerts:delete

    Chats:
    - chats:read
    - chats:send

    Notifications:
    - notifications:read
    - notifications:send

    Privilege Management:
    - privilege_codes:create
    - privilege_codes:read
    - privilege_codes:revoke
    - audit_logs:read
  title: Disaster Alert API
  version: 1.0.0
paths:
  /admin/alerts:
    post:
      consumes:
      - application/json
      description: |-
        Creates a verified public alert from the admin dashboard.

        WHEN TO USE THIS ENDPOINT:
        Use this when an admin wants to manually publish a public safety alert such as flood warning, fire outbreak, weather danger, health risk, security threat, conflict warning, or other emergency.

        IMPORTANT:
        This is for admin-created alerts.
        User-submitted reports should normally be approved through /admin/reports/{id}/approve so that the report is converted into an alert.

        REQUIRED HEADERS:
        - Sigtrack-Admin-API-Key: Your admin API key.
        - X-Privilege-Code: A valid privilege code with `alerts:create`.

        REQUIRED FIELDS:
        - title: Short headline users will see.
        - description: Full alert details.
        - category: Type of emergency.
        - severity: low, medium, high, or critical.
        - latitude: Alert latitude.
        - longitude: Alert longitude.

        OPTIONAL FIELDS:
        - summary: Short preview text.
        - status: draft, active, resolved, expired, or cancelled.
        - address, country, region: Human-readable location details.
        - radiusKm: Approximate affected radius in kilometers.
        - safetyInstructions: List of instructions for users.
        - imageUrls/videoUrls: Media links.
        - eventTime/expiresAt: ISO date/time values.

        EXAMPLE REQUEST BODY:
        {
        "title": "Heavy rainfall warning",
        "description": "Heavy rainfall is expected in Accra with possible flooding in low-lying areas.",
        "summary": "Heavy rainfall expected in Accra with possible flooding.",
        "category": "weather",
        "severity": "high",
        "status": "active",
        "latitude": 5.6037,
        "longitude": -0.1870,
        "address": "Circle, Accra",
        "country": "Ghana",
        "region": "Greater Accra",
        "radiusKm": 10,
