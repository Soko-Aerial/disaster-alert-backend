  /assistance:
    post:
      consumes:
      - application/json
      description: |-
        Allows an authenticated mobile user to request help during or after an emergency.

        WHEN TO USE THIS ENDPOINT:
        Use this when a user needs medical help, rescue, food, shelter, security support, evacuation, or other assistance.

        DIFFERENCE BETWEEN SOS AND ASSISTANCE:
        - SOS is for immediate emergency panic situations.
        - Assistance is for structured help requests that responders/admins can review and manage.

        AUTH REQUIRED:
        This endpoint requires a valid user JWT token.
        Click Authorize and paste: Bearer YOUR_JWT_TOKEN.

        REQUIRED FIELDS:
        - assistanceType: Type of help needed. Example: medical.
        - urgencyLevel: low, medium, high, or critical.
        - affectedIndividuals: Number of people needing help. Minimum is 1.
        - latitude: User/request latitude.
        - longitude: User/request longitude.

        OPTIONAL FIELDS:
        - otherInformation: Extra details about the situation.
        - address: Human-readable location or landmark.

        EXAMPLE REQUEST BODY:
        {
        "assistanceType": "medical",
        "urgencyLevel": "high",
        "affectedIndividuals": 3,
        "otherInformation": "One person is injured and needs urgent medical support.",
        "latitude": 5.6037,
        "longitude": -0.1870,
        "address": "Circle, Accra"
        }
      parameters:
      - description: Assistance request payload. assistanceType, urgencyLevel, affectedIndividuals,
          latitude, and longitude are required.
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/disaster_alert_backend_internal_dto.CreateAssistanceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Assistance request submitted successfully.
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request body, validation failed, or request could not
            be created.
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing, invalid, or expired user token.
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Server error while submitting assistance request.
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Submit an assistance request
      tags:
      - User Assistance
