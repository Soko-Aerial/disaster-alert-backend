basePath: /api/v1
definitions:
  disaster_alert_backend_internal_dto.CreateAdminPrivilegeCodeRequest:
    properties:
      expiresAt:
        example: "2026-07-28T12:00:00Z"
        type: string
      label:
        example: Police Traffic Unit Access
        type: string
      levelId:
        example: firebase_traffic_unit_id
        type: string
      levelName:
        example: Traffic Unit
        type: string
      organisationId:
        example: firebase_police_org_id
        type: string
      organisationName:
        example: Ghana Police Service
        type: string
      permissions:
        example:
        - sos:read
        items:
          type: string
        minItems: 1
        type: array
      purpose:
        example: Allow Police Traffic Unit to view SOS and update SOS status
        type: string
    required:
    - label
    - organisationId
    - organisationName
    - permissions
    type: object
  disaster_alert_backend_internal_dto.CreateAlertRequest:
    properties:
      address:
        example: Circle, Accra
        type: string
      category:
        enum:
        - flood
        - fire
        - weather
        - health
        - security
        - earthquake
        - conflict
        - other
        example: flood
        type: string
      confidence:
        example: 0.95
        type: number
      country:
        example: Ghana
        type: string
      description:
        example: Heavy rainfall is expected in Accra with possible flooding in low-lying
          areas.
        minLength: 5
        type: string
      eventTime:
        example: "2026-06-25T10:00:00Z"
        type: string
      expiresAt:
        example: "2026-06-26T18:00:00Z"
        type: string
      externalId:
        example: GDACS-12345
        type: string
      imageUrls:
        example:
        - https://example.com/flood-image.jpg
        items:
          type: string
        type: array
      latitude:
        example: 5.6037
        type: number
      longitude:
        example: -0.187
        type: number
      priorityLabel:
        enum:
        - breaking
        - serious
        - watch
        - low
        example: serious
        type: string
      priorityScore:
        example: 85
        type: integer
      radiusKm:
        example: 10
        type: number
      region:
        example: Greater Accra
        type: string
      safetyInstructions:
        example:
        - Move to higher ground
        items:
          type: string
        type: array
      severity:
        enum:
        - low
        - medium
        - high
        - critical
        example: high
        type: string
      sourceName:
        example: Admin Dashboard
        type: string
      sourceType:
        enum:
        - internal
        - external
        - system
        - user_report
        - weather
        - health
        - news
        - admin
        example: admin
        type: string
      sourceUrl:
        example: https://example.com/source-alert
        type: string
      status:
        enum:
        - draft
        - active
        - resolved
        - expired
        - cancelled
        example: active
        type: string
      summary:
        example: Heavy rainfall expected in Accra with possible flooding.
        type: string
      tags:
        example:
        - flood
        - ghana
        - accra
        items:
          type: string
        type: array
      title:
        example: Heavy rainfall warning
        type: string
      videoUrls:
        example:
        - https://example.com/flood-video.mp4
        items:
          type: string
        type: array
    required:
    - category
    - description
    - latitude
    - longitude
    - severity
    - title
    type: object
  disaster_alert_backend_internal_dto.RevokeAdminPrivilegeCodeRequest:
    properties:
      reason:
        example: Access no longer needed
        type: string
    type: object
  disaster_alert_backend_internal_dto.SendChatMessageRequest:
    properties:
      message:
        example: Help is on the way. Please remain in a safe location.
        type: string
    required:
    - message
    type: object
  disaster_alert_backend_internal_dto.SendTestNotificationRequest:
    properties:
      body:
        type: string
      title:
        type: string
    required:
    - body
    - title
    type: object
  disaster_alert_backend_internal_dto.UpdateAlertStatusRequest:
    properties:
      status:
        enum:
        - draft
        - active
        - resolved
        - expired
        - cancelled
        example: resolved
        type: string
    required:
    - status
    type: object
  disaster_alert_backend_internal_dto.UpdateAssistanceStatusRequest:
    properties:
      status:
        enum:
        - pending
        - accepted
        - en_route
        - arrived
        - completed
        - cancelled
        - rejected
        example: en_route
        type: string
    required:
    - status
    type: object
  disaster_alert_backend_internal_dto.UpdateSOSStatusRequest:
    properties:
      status:
        enum:
        - active
        - assigned
        - resolved
        - cancelled
        example: resolved
        type: string
    required:
    - status
    type: object
  disaster_alert_backend_internal_dto.ValidateAdminPrivilegeCodeRequest:
    properties:
      uuid:
        example: 4e1b5a0a-71d7-40ad-9f30-9f1c4cbb1d9e
        type: string
    required:
    - uuid
    type: object
info:
  contact: {}
  description: |-
    Mission-control API for real-time disaster intelligence, community incident reports, SOS escalation, assistance coordination, emergency messaging, alerts, chats, notifications, and administrator response operations.

    ================================
    AUTHENTICATION GUIDE
    ================================

    1. Mobile/User endpoints use BearerAuth.
    Header:
    Authorization: Bearer <JWT_TOKEN>

    2. Basic admin management endpoints use AdminApiKeyAuth only.
    Header:
    Sigtrack-Admin-API-Key: <ADMIN_API_KEY>

    3. Privileged admin operation endpoints require BOTH AdminApiKeyAuth and PrivilegeCodeAuth.
    Headers:
    Sigtrack-Admin-API-Key: <ADMIN_API_KEY>
    X-Privilege-Code: <GENERATED_UUID>

    ================================
    ADMIN PRIVILEGE CODE FLOW
    ================================

    Step 1: Click Authorize in Swagger.
    Step 2: Enter your Admin API Key under AdminApiKeyAuth.
    Step 3: Call POST /admin/privilege-codes to generate a privilege UUID.
    Step 4: Copy the full UUID from data.code in the response.
    Step 5: Click Authorize again and paste the UUID under PrivilegeCodeAuth.
    Step 6: Test protected admin endpoints such as reports, assistance, SOS, alerts, chats, and notifications.

    IMPORTANT:
    The full UUID is returned only once during creation.
    codePrefix is only for display and audit logs. Do not use codePrefix as X-Privilege-Code.

    ================================
    ADMIN PERMISSION CATALOG
    ================================

    Reports:
    - reports:read
    - reports:approve

    Assistance:
    - assistance:read
    - assistance:update_status

    SOS:
    - sos:read
    - sos:update_status

    Alerts:
    - alerts:read
    - alerts:create
    - alerts:update
    - alerts:delete

    Chats:
    - chats:read
    - chats:send

    Notifications:
    - notifications:read
    - notifications:send

    Privilege Management:
    - privilege_codes:create
    - privilege_codes:read
    - privilege_codes:revoke
    - audit_logs:read
  title: Disaster Alert API
  version: 1.0.0
paths:
  /admin/alerts:
    post:
      consumes:
      - application/json
      description: |-
        Creates a manual emergency alert from the admin dashboard.

        Use this endpoint when an admin wants to publish a flood warning, fire outbreak, weather danger, health risk, security threat, or other public safety alert.
        The alert can later be shown to users based on country/location and can also be delivered through notifications or WebSocket updates.

        SECURITY:
        This endpoint requires BOTH AdminApiKeyAuth and PrivilegeCodeAuth.

        REQUIRED PERMISSION:
        alerts:create

        EXAMPLE REQUEST BODY:
        {"title":"Heavy Rainfall Warning","description":"Heavy rainfall expected in flood-prone areas.","category":"weather","severity":"high","latitude":5.6037,"longitude":-0.1870,"country":"Ghana","region":"Greater Accra","address":"Accra"}
      parameters:
      - description: Alert creation payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/disaster_alert_backend_internal_dto.CreateAlertRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Alert created successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request body or validation failed
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing or invalid Admin API Key
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Missing, revoked, expired, or unauthorized privilege code
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to create alert
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
        PrivilegeCodeAuth: []
      summary: Create a new admin alert
      tags:
      - Admin Alerts
  /admin/alerts/{id}:
    delete:
      description: |-
        Deletes an alert from the admin dashboard.

        SECURITY:
        This endpoint requires BOTH AdminApiKeyAuth and PrivilegeCodeAuth.

        REQUIRED PERMISSION:
        alerts:delete
      parameters:
      - description: Alert ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Alert deleted successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid alert ID
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing or invalid Admin API Key
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Missing, revoked, expired, or unauthorized privilege code
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Alert not found
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
        PrivilegeCodeAuth: []
      summary: Delete alert
      tags:
      - Admin Alerts
    get:
      description: |-
        Fetches details of a single alert by ID.

        SECURITY:
        This endpoint requires BOTH AdminApiKeyAuth and PrivilegeCodeAuth.

        REQUIRED PERMISSION:
        alerts:read
      parameters:
      - description: Alert ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Alert fetched successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid alert ID
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing or invalid Admin API Key
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Missing, revoked, expired, or unauthorized privilege code
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Alert not found
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
        PrivilegeCodeAuth: []
      summary: Get one alert for admin
      tags:
      - Admin Alerts
  /admin/alerts/{id}/status:
    put:
      consumes:
      - application/json
      description: |-
        Updates the status of an alert from the admin dashboard.

        Use this endpoint to mark an alert as active, inactive, resolved, expired, cancelled.

        SECURITY:
        This endpoint requires BOTH AdminApiKeyAuth and PrivilegeCodeAuth.

        REQUIRED PERMISSION:
        alerts:update

        EXAMPLE REQUEST BODY:
        {"status":"resolved"}
      parameters:
      - description: Alert ID
        in: path
        name: id
        required: true
        type: string
      - description: Alert status update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/disaster_alert_backend_internal_dto.UpdateAlertStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Alert status updated successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request body, validation error, or invalid alert status
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing or invalid Admin API Key
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Missing, revoked, expired, or unauthorized privilege code
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Alert not found
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
        PrivilegeCodeAuth: []
      summary: Update alert status
      tags:
      - Admin Alerts
  /admin/alerts/global:
    get:
      description: |-
        Fetches global alerts for the admin dashboard.

        Optionally pass country to exclude or compare local context depending on your service logic.

        SECURITY:
        This endpoint requires BOTH AdminApiKeyAuth and PrivilegeCodeAuth.

        REQUIRED PERMISSION:
        alerts:read
      parameters:
      - description: Optional country context
        example: Ghana
        in: query
        name: country
        type: string
      - description: Maximum number of alerts to return. Default is 50, maximum is
          200
        example: 50
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Global alerts fetched successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing or invalid Admin API Key
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Missing, revoked, expired, or unauthorized privilege code
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to fetch global alerts
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
        PrivilegeCodeAuth: []
      summary: List global alerts for admin
      tags:
      - Admin Alerts
  /admin/alerts/local:
    get:
      description: |-
        Fetches alerts relevant to a specific country.

        Example: country=Ghana returns alerts affecting Ghana.
        Use this endpoint in the admin dashboard when reviewing local alerts by country.

        SECURITY:
        This endpoint requires BOTH AdminApiKeyAuth and PrivilegeCodeAuth.

        REQUIRED PERMISSION:
        alerts:read
      parameters:
      - description: Country name used to filter local alerts
        example: Ghana
        in: query
        name: country
        required: true
        type: string
      - description: Maximum number of alerts to return. Default is 50, maximum is
          200
        example: 50
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Local alerts fetched successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Country query parameter is required
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing or invalid Admin API Key
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Missing, revoked, expired, or unauthorized privilege code
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to fetch local alerts
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
        PrivilegeCodeAuth: []
      summary: List local alerts for admin
      tags:
      - Admin Alerts
  /admin/assistance:
    get:
      description: |-
        Returns all assistance requests submitted by users.

        SECURITY:
        This endpoint requires BOTH AdminApiKeyAuth and PrivilegeCodeAuth.

        REQUIRED PERMISSION:
        assistance:read

        SWAGGER TESTING:
        1. Click Authorize.
        2. Enter Sigtrack-Admin-API-Key under AdminApiKeyAuth.
        3. Enter the generated full UUID under PrivilegeCodeAuth.
        4. Execute this endpoint.
      produces:
      - application/json
      responses:
        "200":
          description: Assistance requests fetched successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing or invalid Admin API Key
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Missing, revoked, expired, or unauthorized privilege code
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to fetch assistance requests
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
        PrivilegeCodeAuth: []
      summary: List assistance requests for admin
      tags:
      - Admin Assistance
  /admin/assistance/{id}:
    get:
      description: |-
        Returns the full details of a single assistance request.

        SECURITY:
        This endpoint requires BOTH AdminApiKeyAuth and PrivilegeCodeAuth.

        REQUIRED PERMISSION:
        assistance:read
      parameters:
      - description: Assistance Request ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Assistance request fetched successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid assistance request ID
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing or invalid Admin API Key
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Missing, revoked, expired, or unauthorized privilege code
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Assistance request not found
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
        PrivilegeCodeAuth: []
      summary: Get one assistance request for admin
      tags:
      - Admin Assistance
  /admin/assistance/{id}/status:
    put:
      consumes:
      - application/json
      description: |-
        Updates the status of a user assistance request from the admin dashboard.

        Use this endpoint when an admin accepts a request, dispatches help, marks responders as en route, confirms arrival, completes the request, cancels it, or rejects it.
        The mobile app can use this status to update the user's assistance card in real time.

        SECURITY:
        This endpoint requires BOTH AdminApiKeyAuth and PrivilegeCodeAuth.

        REQUIRED PERMISSION:
        assistance:update_status

        EXAMPLE REQUEST BODY:
        {"status":"en_route"}

        COMMON STATUS VALUES:
        pending, accepted, en_route, arrived, completed, cancelled, rejected
      parameters:
      - description: Assistance Request ID
        in: path
        name: id
        required: true
        type: string
      - description: Status update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/disaster_alert_backend_internal_dto.UpdateAssistanceStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Assistance status updated successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request body, validation error, or invalid status
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing or invalid Admin API Key
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Missing, revoked, expired, or unauthorized privilege code
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Assistance request not found
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
        PrivilegeCodeAuth: []
      summary: Update assistance request status
      tags:
      - Admin Assistance
  /admin/chats/conversations:
    get:
      description: |-
        Returns user chat conversations visible to the admin dashboard.

        SECURITY:
        This endpoint requires BOTH AdminApiKeyAuth and PrivilegeCodeAuth.

        REQUIRED PERMISSION:
        chats:read
      produces:
      - application/json
      responses:
        "200":
          description: Conversations fetched successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing or invalid Admin API Key
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Missing, revoked, expired, or unauthorized privilege code
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to fetch conversations
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
        PrivilegeCodeAuth: []
      summary: List admin chat conversations
      tags:
      - Admin Chats
  /admin/chats/conversations/{id}/messages:
    get:
      description: |-
        Returns messages inside a selected chat conversation.

        SECURITY:
        This endpoint requires BOTH AdminApiKeyAuth and PrivilegeCodeAuth.

        REQUIRED PERMISSION:
        chats:read
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Messages fetched successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid conversation ID
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing or invalid Admin API Key
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Missing, revoked, expired, or unauthorized privilege code
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Conversation not found
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
        PrivilegeCodeAuth: []
      summary: Get admin conversation messages
      tags:
      - Admin Chats
    post:
      consumes:
      - application/json
      description: |-
        Sends a message from the admin dashboard into a user conversation.

        Use this endpoint when an admin, responder, or support team needs to reply to a user during an SOS case, assistance request, incident report, or general support conversation.
        The message can be delivered to the user through the app and real-time WebSocket updates.

        SECURITY:
        This endpoint requires BOTH AdminApiKeyAuth and PrivilegeCodeAuth.

        REQUIRED PERMISSION:
        chats:send

        EXAMPLE REQUEST BODY:
        {"message":"Hello, this is the emergency response team. Please confirm your current location."}
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      - description: Chat message payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/disaster_alert_backend_internal_dto.SendChatMessageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Message sent successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request body or conversation ID
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing or invalid Admin API Key
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Missing, revoked, expired, or unauthorized privilege code
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Conversation not found
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
        PrivilegeCodeAuth: []
      summary: Send admin chat message
      tags:
      - Admin Chats
  /admin/maintenance/cleanup-expired-alerts:
    post:
      description: |-
        Deactivates expired external alerts from configured alert sources.

        This is an admin maintenance operation used to keep the alert feed clean by marking expired external alerts as inactive.

        SECURITY:
        This endpoint requires BOTH AdminApiKeyAuth and PrivilegeCodeAuth.

        REQUIRED PERMISSION:
        alerts:update
      produces:
      - application/json
      responses:
        "200":
          description: Expired external alerts cleaned up successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing or invalid Admin API Key
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Missing, revoked, expired, or unauthorized privilege code
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to cleanup expired external alerts
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
        PrivilegeCodeAuth: []
      summary: Cleanup expired external alerts
      tags:
      - Admin Maintenance
  /admin/notifications/test/all:
    post:
      consumes:
      - application/json
      description: |-
        Queues a broadcast test notification to all registered users.

        Use this endpoint to verify Firebase Cloud Messaging, notification queue processing, and mobile push delivery.

        SECURITY:
        This admin endpoint requires BOTH AdminApiKeyAuth and PrivilegeCodeAuth.

        REQUIRED PERMISSION:
        notifications:send

        EXAMPLE REQUEST BODY:
        {"title":"Disaster Alert Test","body":"This is a test broadcast notification."}
      parameters:
      - description: Broadcast test notification payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/disaster_alert_backend_internal_dto.SendTestNotificationRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Broadcast notification queued successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request body or validation error
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing or invalid Admin API Key
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Missing, revoked, expired, or unauthorized privilege code
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Notification queue is full
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
        PrivilegeCodeAuth: []
      summary: Send notification to all users
      tags:
      - Admin Notifications
  /admin/privilege-codes:
    get:
      description: |-
        Returns privilege-code records created for organisations, departments, units, or admin levels.

        SECURITY:
        This endpoint requires only AdminApiKeyAuth.

        IMPORTANT:
        The full UUID is not returned here for security reasons.
        Only codePrefix is returned so admins can identify the record without exposing the full secret UUID.

        Use this endpoint to review active, revoked, expired, and previously created privilege codes.
      parameters:
      - description: Maximum number of privilege-code records to return. Default is
          50. Maximum is 200.
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Privilege codes fetched successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Admin API key missing or invalid
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to fetch privilege codes
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
      summary: List generated admin privilege codes
      tags:
      - Admin Privilege Codes
    post:
      consumes:
      - application/json
      description: |-
        Creates a new privilege code for an organisation, unit, department, or admin level.

        This endpoint is used to generate the UUID that will later be sent in the X-Privilege-Code header.
        It requires only the Admin API Key because this endpoint is used to create privilege codes.

        HOW TO USE IN SWAGGER:
        1. Click Authorize.
        2. Enter Sigtrack-Admin-API-Key under AdminApiKeyAuth.
        3. Execute this endpoint.
        4. Copy data.code from the response.
        5. Click Authorize again.
        6. Paste data.code under PrivilegeCodeAuth.

        IMPORTANT:
        The full UUID is returned only once during creation.
        The codePrefix is only for display and audit logs. Do not use codePrefix as X-Privilege-Code.

        EXAMPLE PERMISSIONS:
        assistance:read, assistance:update_status, sos:read, sos:update_status, reports:read, reports:approve, alerts:read, alerts:create, alerts:update, alerts:delete
      parameters:
      - description: Privilege code creation payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/disaster_alert_backend_internal_dto.CreateAdminPrivilegeCodeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Privilege code created successfully. Copy data.code and use
            it as X-Privilege-Code.
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request body, validation error, or invalid permissions
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Admin API key missing or invalid
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to create privilege code
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
      summary: Generate a new admin privilege UUID
      tags:
      - Admin Privilege Codes
  /admin/privilege-codes/{id}:
    get:
      description: |-
        Fetches one privilege-code record by database ID.

        SECURITY:
        This endpoint requires only AdminApiKeyAuth.

        IMPORTANT:
        This endpoint does not return the full UUID.
        If the full UUID is lost, revoke the old privilege code and generate a new one.
      parameters:
      - description: Privilege-code database ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Privilege code fetched successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Admin API key missing or invalid
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Privilege code not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to fetch privilege code
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
      summary: Get one privilege-code record
      tags:
      - Admin Privilege Codes
  /admin/privilege-codes/{id}/revoke:
    put:
      consumes:
      - application/json
      description: |-
        Disables a privilege UUID so it can no longer be used on protected admin endpoints.

        SECURITY:
        This endpoint requires only AdminApiKeyAuth.

        WHAT REVOKE MEANS:
        Revoke does not delete the database record.
        It changes the privilege-code status from active to revoked.
        The old UUID stops working, but the record remains for audit history.

        WHEN TO REVOKE:
        Revoke a code when it is leaked, no longer trusted, assigned to the wrong level, or needs to be replaced by a new UUID.
      parameters:
      - description: Privilege-code database ID
        in: path
        name: id
        required: true
        type: string
      - description: Revocation reason
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/disaster_alert_backend_internal_dto.RevokeAdminPrivilegeCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Privilege code revoked successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request or privilege code already revoked
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Admin API key missing or invalid
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Privilege code not found
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
      summary: Revoke a privilege code
      tags:
      - Admin Privilege Codes
  /admin/privilege-codes/validate:
    post:
      consumes:
      - application/json
      description: |-
        Checks whether a full UUID privilege code is valid, active, not expired, and usable.

        SECURITY:
        This endpoint requires only AdminApiKeyAuth.

        WHEN TO USE:
        Use this endpoint when testing a generated UUID before applying it to protected admin endpoints.

        IMPORTANT:
        Send the full UUID in the request body.
        Do not send codePrefix. codePrefix is only for display and logs.
      parameters:
      - description: Full privilege UUID validation payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/disaster_alert_backend_internal_dto.ValidateAdminPrivilegeCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Privilege code is valid
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request body, invalid UUID, expired code, or revoked
            code
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Admin API key missing or invalid
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
      summary: Validate a privilege UUID
      tags:
      - Admin Privilege Codes
  /admin/privilege-logs:
    get:
      description: |-
        Fetches audit logs for privilege-code creation, validation, revocation, and permission checks.

        SECURITY:
        This endpoint requires only AdminApiKeyAuth.

        WHAT THIS LOG SHOWS:
        - When a privilege code was created
        - When a privilege code was validated
        - When a privilege code was revoked
        - Which admin endpoint was accessed
        - Which permission was required
        - Whether access was allowed or denied
        - The codePrefix, organisation, level, IP address, and user agent involved
      parameters:
      - description: Maximum number of logs to return. Default is 100. Maximum is
          500.
        in: query
        name: limit
        type: integer
      - description: Filter logs by privilege-code database ID
        in: query
        name: privilegeCodeId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Privilege logs fetched successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Admin API key missing or invalid
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to fetch privilege logs
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
      summary: List privilege audit logs
      tags:
      - Admin Privilege Logs
  /admin/reports:
    get:
      description: |-
        Returns all user-submitted incident reports for review in the admin dashboard.

        SECURITY:
        This endpoint requires BOTH AdminApiKeyAuth and PrivilegeCodeAuth.

        REQUIRED PERMISSION:
        reports:read
      produces:
      - application/json
      responses:
        "200":
          description: Reports fetched successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing or invalid Admin API Key
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Missing, revoked, expired, or unauthorized privilege code
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to fetch reports
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
        PrivilegeCodeAuth: []
      summary: List incident reports for admin
      tags:
      - Admin Reports
  /admin/reports/{id}:
    get:
      description: |-
        Returns details of a single user-submitted incident report.

        SECURITY:
        This endpoint requires BOTH AdminApiKeyAuth and PrivilegeCodeAuth.

        REQUIRED PERMISSION:
        reports:read
      parameters:
      - description: Report ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Report fetched successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid report ID
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing or invalid Admin API Key
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Missing, revoked, expired, or unauthorized privilege code
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Report not found
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
        PrivilegeCodeAuth: []
      summary: Get one incident report for admin
      tags:
      - Admin Reports
  /admin/reports/{id}/approve:
    put:
      description: |-
        Approves a user-submitted incident report and converts it into a public alert.
        The public alert is shown in alert feeds, notifications, WebSocket updates, and home screen alert cards.

        SECURITY:
        This endpoint requires BOTH AdminApiKeyAuth and PrivilegeCodeAuth.

        REQUIRED PERMISSION:
        reports:approve

        Use this endpoint only after an admin verifies that the submitted report is credible and should become an official alert.
      parameters:
      - description: Report ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Report approved and alert published successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Report cannot be approved
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing or invalid Admin API Key
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Missing, revoked, expired, or unauthorized privilege code
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Report not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to approve report
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
        PrivilegeCodeAuth: []
      summary: Approve user report and publish alert
      tags:
      - Admin Reports
  /admin/sos:
    get:
      description: |-
        Returns all SOS emergency requests submitted by users.

        SECURITY:
        This endpoint requires BOTH AdminApiKeyAuth and PrivilegeCodeAuth.

        REQUIRED PERMISSION:
        sos:read
      produces:
      - application/json
      responses:
        "200":
          description: SOS requests fetched successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing or invalid Admin API Key
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Missing, revoked, expired, or unauthorized privilege code
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to fetch SOS requests
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
        PrivilegeCodeAuth: []
      summary: List SOS requests for admin
      tags:
      - Admin SOS
  /admin/sos/{id}:
    get:
      description: |-
        Returns details of a single SOS emergency request.

        SECURITY:
        This endpoint requires BOTH AdminApiKeyAuth and PrivilegeCodeAuth.

        REQUIRED PERMISSION:
        sos:read
      parameters:
      - description: SOS ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: SOS request fetched successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid SOS ID
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing or invalid Admin API Key
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Missing, revoked, expired, or unauthorized privilege code
          schema:
            additionalProperties: true
            type: object
        "404":
          description: SOS request not found
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
        PrivilegeCodeAuth: []
      summary: Get one SOS request for admin
      tags:
      - Admin SOS
  /admin/sos/{id}/status:
    put:
      consumes:
      - application/json
      description: |-
        Updates the status of an SOS emergency request from the admin dashboard.

        Use assigned when a responder/admin has taken the case, resolved when the emergency is handled, and cancelled when the request is cancelled.
        The mobile app can stop SOS alarm/live tracking when status becomes resolved or cancelled.

        SECURITY:
        This endpoint requires BOTH AdminApiKeyAuth and PrivilegeCodeAuth.

        REQUIRED PERMISSION:
        sos:update_status

        EXAMPLE REQUEST BODY:
        {"status":"assigned"}

        COMMON STATUS VALUES:
        active, assigned, resolved, cancelled
      parameters:
      - description: SOS ID
        in: path
        name: id
        required: true
        type: string
      - description: SOS status update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/disaster_alert_backend_internal_dto.UpdateSOSStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: SOS status updated successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request body, validation error, or invalid status
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing or invalid Admin API Key
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Missing, revoked, expired, or unauthorized privilege code
          schema:
            additionalProperties: true
            type: object
        "404":
          description: SOS request not found
          schema:
            additionalProperties: true
            type: object
      security:
      - AdminApiKeyAuth: []
        PrivilegeCodeAuth: []
      summary: Update SOS emergency status
      tags:
      - Admin SOS
  /admin/ws:
    get:
      description: |
        Establishes a real-time WebSocket connection for the admin dashboard.

        Admin WebSocket URL:
        wss://disaster-alert-backend-tiql.onrender.com/api/v1/admin/ws

        Required header:
        Sigtrack-Admin-API-Key: YOUR_ADMIN_API_KEY

        Event format:
        {"type":"EVENT_NAME","data":{}}

        Admin dashboard events:
        SOS_CREATED - sent when a user creates an SOS request.
        ASSISTANCE_CREATED - sent when a user submits an assistance request.
        REPORT_CREATED - sent when a user submits a report.
        ALERT_CREATED - sent when an active alert is created.
        ALERT_APPROVED - sent when an alert/report is approved.
        CHAT_MESSAGE_CREATED - sent when a user sends a chat message.

        SOS_CREATED example:
        {"type":"SOS_CREATED","data":{"id":"sos_id","user":{"id":"user_id","name":"User","email":"user@email.com","phone":"0240000000","location":{"country":"Ghana","region":"Greater Accra","address":"Accra"}},"emergencyType":"medical","message":"Need help","latitude":5.6037,"longitude":-0.1870,"address":"Accra","status":"active","createdAt":"2026-06-11T10:00:00Z"}}

        ASSISTANCE_CREATED example:
        {"type":"ASSISTANCE_CREATED","data":{"id":"assistance_id","user":{"id":"user_id","name":"User","email":"user@email.com"},"assistanceType":"medical","urgencyLevel":"high","affectedIndividuals":3,"address":"Accra","status":"pending","createdAt":"2026-06-11T10:00:00Z"}}
      produces:
      - application/json
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
      security:
      - AdminApiKeyAuth: []
      summary: Connect Admin WebSocket
      tags:
      - Admin WebSocket
schemes:
- http
- https
securityDefinitions:
  AdminApiKeyAuth:
    in: header
    name: Sigtrack-Admin-API-Key
    type: apiKey
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
  PrivilegeCodeAuth:
    in: header
    name: X-Privilege-Code
    type: apiKey
swagger: "2.0"
