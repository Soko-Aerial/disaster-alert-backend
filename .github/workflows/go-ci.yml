name: Go CI

on:
  push:
    branches: ["disaster-alert-go"]
  pull_request:
    branches: ["disaster-alert-go"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Download dependencies
        run: go mod download

      - name: Verify formatting
        run: gofmt -w .

      - name: Run tests
        run: go test ./...

      - name: Build server
        run: go build -o server ./cmd/server